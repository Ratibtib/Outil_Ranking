name: Contrôles

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  controles:
    name: Données, syntaxe et calculs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier la syntaxe JavaScript
        run: node --check assets/app.js

      - name: Vérifier la cohérence des barèmes
        run: npm run verifier

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Tester les calculs dans le navigateur
        run: npm test
